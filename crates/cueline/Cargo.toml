[package]
name = "cueline"
description = "CueLine: a lightweight timeline player that generates sample-accurate LTC and MIDI Timecode."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "CueLine"
path = "src/main.rs"

[features]
default = []
# Steinberg ASIO support (requires the ASIO SDK and LLVM, see README).
asio = ["cpal/asio"]

[dependencies]
cueline-core = { path = "../cueline-core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
cpal = "0.18"
midir = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac", "adpcm"] }
rubato = "5"
hound = "3.5"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_System_Threading", "Win32_Foundation"] }

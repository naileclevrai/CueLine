[workspace]
resolver = "2"
members = ["crates/cueline-core", "crates/cueline"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/naileclevrai/CueLine"
authors = ["CueLine contributors"]
homepage = "https://github.com/naileclevrai/CueLine"
keywords = ["timecode", "smpte", "ltc", "mtc", "audio"]
categories = ["multimedia::audio"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
